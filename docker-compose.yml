version: "3.9"

# Inputs cross the machine boundary through the authenticated upload API.
# Outputs stay inside the shared session workdir and are downloaded through
# authenticated descriptors. SUBAGENT_HOST_STORAGE_DIR is always a host path;
# container paths remain fixed under /storage.

services:
  executor-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: executor-service:v1.0.0
    ports:
      - "5000:5000"
    env_file:
      - .env
      - .env.secrets
    environment:
      FLASK_PORT: "5000"
      SUBAGENT_BIND_HOST: "0.0.0.0"
      CONTAINER_EXECUTOR_URL: "http://executor-executor:5001"
      EXECUTOR_MANAGEMENT_MODE: "external"
      SUBAGENT_API_TOKEN: ${SUBAGENT_API_TOKEN:?set SUBAGENT_API_TOKEN in .env}
      SUBAGENT_REQUIRE_API_AUTH: "1"
      SUBAGENT_WEBHOOK_TOKEN: ${SUBAGENT_WEBHOOK_TOKEN:?set SUBAGENT_WEBHOOK_TOKEN in .env}
      SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-7200}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKDIR_BASE: /storage/subagent_work
    volumes:
      - ${SUBAGENT_HOST_STORAGE_DIR:-/storage}:/storage:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - executor-net
    depends_on:
      executor-executor:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  executor-executor:
    image: executor-service:v1.0.0
    command: python -m src.executor_server
    env_file:
      # This file must never contain LLM_API_KEY.
      - .env.secrets
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      FLASK_PORT: "5001"
      EXECUTOR_BIND_HOST: "0.0.0.0"
      WORKDIR_BASE: /storage/subagent_work
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EXECUTOR_REQUIRE_UID_ISOLATION: "1"
      EXECUTOR_PARENT_UID: "0"
      EXECUTOR_API_TOKEN: ${EXECUTOR_API_TOKEN:?set EXECUTOR_API_TOKEN in .env}
      EXECUTOR_REQUIRE_AUTH: "1"
      EXECUTOR_TOOL_ENV_PASSTHROUGH: ${EXECUTOR_TOOL_ENV_PASSTHROUGH:-BRAVE_SEARCH_API_KEY,NINEROUTER_URL,NINEROUTER_KEY}
      # Non-secret skill config comes from .env. Skill API keys come directly
      # from env_file above; declaring them here would override those values.
      NINEROUTER_URL: ${NINEROUTER_URL:-}
    volumes:
      - ${SUBAGENT_HOST_STORAGE_DIR:-/storage}/subagent_work:/storage/subagent_work:rw
      - ./skills:/skills:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - executor-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  executor-net:
    driver: bridge
